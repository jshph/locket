[project]
name = "locket-asr"
version = "0.1.0"
description = "Local speech service for locket: live Parakeet transcription for the Omi app's Custom STT, stored audio, offline diarization and voiceprints"
requires-python = ">=3.12"
dependencies = ["sherpa-onnx>=1.12", "numpy>=1.26", "aiohttp>=3.10", "soundfile>=0.12"]

[dependency-groups]
dev = ["pytest>=8"]
